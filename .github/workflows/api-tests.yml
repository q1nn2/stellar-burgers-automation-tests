name: Проверка API и сохранение Allure

on:
  push:
    branches:
      - develop2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить API-тесты
        run: |
          rm -rf allure-results
          pytest -vv tests/api

      - name: Сохранить результаты Allure в репозиторий
        run: |
          git config user.name "q1nn2"
          git config user.email "90451521+q1nn2@users.noreply.github.com"
          git add allure-results
          if git diff --cached --quiet; then
            echo "Изменений в Allure нет"
          else
            git commit -m "Обновлены результаты Allure для API"
            git push origin HEAD:develop2
          fi
